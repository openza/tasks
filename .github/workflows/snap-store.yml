name: Publish Snap Store Edge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: snap-store

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node for pinned Personal Cloud artifact
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Stage verified Personal Cloud artifact for Snap
        run: node scripts/personal-cloud/stage-snap-artifact.mjs

      - name: Build strict Snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Inspect built Snap
        env:
          SNAP_ARTIFACT: ${{ steps.snapcraft.outputs.snap }}
        run: bash packaging/snap/inspect-snap-package.sh "$SNAP_ARTIFACT"

      - name: Smoke test packaged CLI
        env:
          SNAP_ARTIFACT: ${{ steps.snapcraft.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP_ARTIFACT"
          openza-tasks.openza --help
          openza-tasks.openza --version

      - name: Preserve verified Snap
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openza-tasks-store-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

      - name: Publish edge
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: edge
