name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore desktop app
        working-directory: src/Openza.Tasks.Desktop
        run: dotnet restore Openza.Tasks.Desktop.csproj

      - name: Test Core
        working-directory: src/Openza.Tasks.Desktop
        run: dotnet test ../Openza.Tasks.Tests/Openza.Tasks.Tests.csproj -c Release

      - name: Build desktop app
        working-directory: src/Openza.Tasks.Desktop
        run: dotnet build Openza.Tasks.Desktop.csproj -c Release --no-restore

      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/linux/com.openza.Tasks.desktop
          appstreamcli validate --no-net packaging/linux/com.openza.Tasks.metainfo.xml

      - name: Build and inspect Debian package
        run: |
          ./packaging/linux/build-deb.sh 0.1.0 amd64
          dpkg-deb --info artifacts/linux/openza-tasks_0.1.0_amd64.deb

  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Openza.Tasks.slnx

      - name: Test
        run: dotnet test src\Openza.Tasks.Tests\Openza.Tasks.Tests.csproj -c Release --no-restore

      - name: Build app
        run: dotnet build src\Openza.Tasks\Openza.Tasks.csproj -c Release -p:Platform=x64 --no-restore
