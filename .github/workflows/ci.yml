name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Docs-only pull requests (Markdown files and docs/) skip the .NET, Snap and
  # Windows builds. The required checks still report: build-snap is skipped,
  # which GitHub counts as passing, and build-test-linux runs only the
  # packaging contract, which reads the docs. Pushes to main always run in full.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect code changes
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-test-linux:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install desktop metadata validators
        if: needs.changes.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install --yes appstream desktop-file-utils

      - name: Restore desktop app
        if: needs.changes.outputs.code == 'true'
        working-directory: src/Openza.Tasks.Desktop
        run: dotnet restore Openza.Tasks.Desktop.csproj

      - name: Test Core
        if: needs.changes.outputs.code == 'true'
        working-directory: src/Openza.Tasks.Desktop
        run: dotnet test ../Openza.Tasks.Tests/Openza.Tasks.Tests.csproj -c Release

      - name: Build desktop app
        if: needs.changes.outputs.code == 'true'
        working-directory: src/Openza.Tasks.Desktop
        run: dotnet build Openza.Tasks.Desktop.csproj -c Release --no-restore

      - name: Setup Node for packaging scripts
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Test artifact verification
        if: needs.changes.outputs.code == 'true'
        run: node --test scripts/personal-cloud/*.test.mjs

      - name: Validate Desktop publish
        if: needs.changes.outputs.code == 'true'
        run: node scripts/personal-cloud/publish-desktop.mjs 1.3.0

      - name: Validate Snap packaging contract
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/personal-cloud-localhost-recovery') }}
        run: bash packaging/snap/test-snap-package.sh

  build-snap:
    # This first Personal Cloud integration is authorized for Linux validation only.
    # Other PRs (including forks with the same branch name) and main retain all jobs.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/personal-cloud-localhost-recovery') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build strict Snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Preserve Snap for CI inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openza-tasks-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

      - name: Inspect built Snap
        env:
          SNAP_ARTIFACT: ${{ steps.snapcraft.outputs.snap }}
        run: bash packaging/snap/inspect-snap-package.sh "$SNAP_ARTIFACT"

      - name: Smoke test packaged CLI
        env:
          SNAP_ARTIFACT: ${{ steps.snapcraft.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP_ARTIFACT"
          openza-tasks.openza --help
          openza-tasks.openza --version

  build-test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/personal-cloud-localhost-recovery') }}
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore desktop and shared tests
        working-directory: src/Openza.Tasks.Desktop
        run: dotnet restore ../Openza.Tasks.Tests/Openza.Tasks.Tests.csproj

      - name: Test shared suite
        working-directory: src/Openza.Tasks.Desktop
        run: dotnet test ../Openza.Tasks.Tests/Openza.Tasks.Tests.csproj -c Release --no-restore

      - name: Build Avalonia desktop app
        working-directory: src/Openza.Tasks.Desktop
        run: dotnet build Openza.Tasks.Desktop.csproj -c Release --no-restore
