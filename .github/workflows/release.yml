name: Release Validation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: Validation scope (Linux Snap artifacts do not publish a release)
        type: choice
        options: [all, linux-snap]
        default: all

permissions:
  contents: read

jobs:
  validate-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms != 'linux-snap' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Openza.Tasks.slnx

      - name: Test
        run: dotnet test src\Openza.Tasks.Tests\Openza.Tasks.Tests.csproj -c Release --no-restore

      - name: Build app
        run: dotnet build src\Openza.Tasks\Openza.Tasks.csproj -c Release -p:Platform=x64 --no-restore

  validate-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install desktop metadata validators
        run: sudo apt-get update && sudo apt-get install --yes appstream desktop-file-utils

      - name: Test Core
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms != 'linux-snap' }}
        run: dotnet test src/Openza.Tasks.Tests/Openza.Tasks.Tests.csproj -c Release

      - name: Validate Linux metadata
        run: bash packaging/snap/test-snap-package.sh

      - name: Setup Node for pinned Personal Cloud artifact
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Test artifact verification and staging
        run: node --test scripts/personal-cloud/*.test.mjs

      - name: Stage pinned Personal Cloud artifact for Snapcraft
        run: node scripts/personal-cloud/stage-snap-artifact.mjs

      - name: Build strict Snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Inspect built Snap
        env:
          SNAP_ARTIFACT: ${{ steps.snapcraft.outputs.snap }}
        run: bash packaging/snap/inspect-snap-package.sh "$SNAP_ARTIFACT"

      - name: Smoke test packaged CLI
        env:
          SNAP_ARTIFACT: ${{ steps.snapcraft.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP_ARTIFACT"
          openza-tasks.openza --help
          openza-tasks.openza --version

      - name: Preserve verified Snap
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openza-tasks-release-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
